# Deploy ASP.NET Core application to Azure Web App on Linux

name: Deploy ZooMapProject to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'  # Specify the version you're using

      - name: Restore dependencies
        run: dotnet restore ZooMapProject/ZooMapProject.csproj

      - name: Build project
        run: dotnet build --configuration Release ZooMapProject/ZooMapProject.csproj

      - name: Publish project
        run: dotnet publish ZooMapProject/ZooMapProject.csproj -c Release -o ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_24176D1C898645208A3C9CF792355049 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B1E1566B02A44B65B8649ADDCB781D80 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A3C9728C8E674CD6A22FB9D3864B959E }}
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ZooMapProject'                # Replace with your Azure Web App name
          package: ./publish
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          
